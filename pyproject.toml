[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baishuai11-datasim_jd369"
version = "0.1.0"
description = "把候选项映射到类别上，算出数据合成与仿真工程师·回归集与线上样本的差分的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "baishuai11" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://baishuai11.github.io"
Repository = "https://github.com/baishuai11/datasim_jd369"
Issues = "https://github.com/baishuai11/datasim_jd369/issues"

[project.scripts]
datasim_jd369 = "datasim_jd369:main"

[tool.setuptools]
py-modules = ["datasim_jd369"]
